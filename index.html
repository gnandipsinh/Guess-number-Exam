<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Guess Number</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">

        <div class="row">
            <div class="col d-flex justify-content-between align-items-center">

                <button id="againBtn" class="again-btn">
                    Again!
                </button>

                <p>(Between 1 and 20)</p>

            </div>
        </div>

        <section class="game-area">

            <div class="row">
                <div class="col d-flex justify-content-center">

                    <h1 class="guess">
                        Guess My Number!
                    </h1>


                </div>
                
            </div>
            <div class="number col d-flex justify-content-center align-items-center" id="number">?</div>

            <div class="row mt-5">

                <div class="col-md-6">

                    <input type="number" id="guessInput" class="guess-btn" min="1" max="20">

                    <div class="mt-2 mb-3">

                        <button id="checkBtn" class="check-btn">
                            Check!
                        </button>

                    </div>

                </div>

                <div class="col-md-6 mt-3">

                    <p id="message" class="message">
                        correct answer ...
                    </p>

                    <p>
                        Score:
                        <span id="score">0</span>
                    </p>

                    <p>
                        Highscore:
                        <span id="highscore">0</span>
                    </p>

                </div>

            </div>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
